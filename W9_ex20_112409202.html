<!DOCTYPE html>
<html>
<head>
<style>
table, th, td{
    border-collapse: collapse;
    border: 1px solid black;
    height: 30px;
    width: 20%
}

th {
    background-color: gray;
    color: white;
}

td{
    text-align: left;
    padding: 5px;
}

tr:nth-child(even) {background-color: yellow;}
div.fixed {
    position:fixed;
    top: 10px;
    right: 0px;
    width: 100px;
    height: 100px;
    border: 3px solid green;
}
</style>
</head>
<body>

<table>
    <tr>
        <th>Firstname</th>
        <th>Lastname</th>
    </tr>
    <tr>
        <td>1</td>
        <td>1</td>
    </tr>
    <tr>
        <td>2</td>
        <td>2</td>
    </tr>
    <tr>
        <td>3</td>
        <td>3</td>
    </tr>
</table>

<div class="fixed">This div element has position: fixed;</div>
<p>112409202 鍾主悅</p>

</body>
</html>
