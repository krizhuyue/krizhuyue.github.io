<!DOCTYPE html>
<html>
<head>
    <style>
        body{
            font-family: "Times New Roman", Times, serif;
            /* font-family: "Times New Roman", serif; /*用Times new roman，沒有再用serif有襯線字體 */
            margin: 40px; /* 網頁頁面四周留有40px空白 */
        }
        /* heading1*/
        h1{
            display: inline-block; /* 外框長度取決於文字長度。 */
            text-decoration: overline; /* 在文字上方畫底線 */
            padding-top: 5px; /*文字上方留5px空白 (邊框下方) */
            text-shadow: 2px 2px pink;
        }
        /*heading 2*/
        h2{
            border: 2px solid black; /*黑色框*/
            outline: 3px outset yellow; /*黃色外框*/
            font-style: italic;
            font-weight: bold;
        }
        /* heading3 */
        h3{
            text-align: right;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <h1>This is heading 1</h1>
    <h2>This is heading 2</h2>
    <h3>This is heading 3</h3>
    <p>112409202 鍾主悅</p>
</body>
</html>
