<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>
        /* 基礎排版 */
        
        .container { 
            display: flex;
            flex-wrap: wrap;       /* 讓 float 的效果被 flex 取代 */
            justify-content: center; /* 讓內容水平置中 */

            width: 90%; 
            margin: 0 auto; 
            background: #fff; 
            overflow: hidden; 
            padding: 10px;
        }
        .box { float: left; box-sizing: border-box; border: 2px solid white; }

        /* --- (b) 大螢幕預設樣式 --- */
        .green-box { width: 100%; height: 180px; background: #A9D045; float: none; }
        
        .blue-box { 
            width: 33.33%; /* 三個一排 */
            height: 220px; 
            background: #00BFFF; 
        }
        
        .gray-box { 
            width: 25%;    /* 四個一排 */
            height: 120px; 
            background: #ECF0F1; 
        }

        /* --- (a) 當寬度小於 480px 時 --- */
        @media screen and (max-width: 500px) {
            .blue-box {
                width: 100%; /* 藍色變成一個一排 (垂直堆疊) */
                height: 100px;
            }

            .gray-box {
                width: 50%;  /* 灰色變成兩個一排 (50% + 50% = 100%) ✨ */
                height: 50px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box green-box"></div>
        
        <div class="box blue-box"></div>
        <div class="box blue-box"></div>
        <div class="box blue-box"></div>
        
        <div class="box gray-box"></div>
        <div class="box gray-box"></div>
        <div class="box gray-box"></div>
        <div class="box gray-box"></div>
    </div>
</body>
</html>
